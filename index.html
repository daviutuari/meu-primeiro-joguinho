<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Carro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #game {
      position: relative;
      width: 400px;
      height: 100vh;
      max-height: 700px;
      margin: auto;
      overflow: hidden;
      background: #555;
      border-left: 8px solid #333;
      border-right: 8px solid #333;
    }

    /* Estrada */
    .road {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to right,
          #222 0%,
          #222 5%,
          #555 5%,
          #555 95%,
          #222 95%,
          #222 100%
        );
    }

    /* Faixas da estrada */
    .line {
      position: absolute;
      width: 8px;
      height: 80px;
      background: white;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.8;
    }

    /* Carro do jogador */
    #player {
      position: absolute;
      width: 55px;
      height: 90px;
      bottom: 30px;
      left: 172px;
      background: #e60000;
      border-radius: 12px 12px 8px 8px;
      z-index: 10;
      box-shadow: 0 0 10px rgba(0,0,0,.5);
    }

    #player::before {
      content: "";
      position: absolute;
      width: 35px;
      height: 35px;
      top: 12px;
      left: 10px;
      background: #55c9ff;
      border-radius: 7px;
      border: 3px solid #222;
    }

    #player::after {
      content: "";
      position: absolute;
      width: 43px;
      height: 10px;
      left: 6px;
      bottom: 12px;
      background: #990000;
      border-radius: 5px;
    }

    /* Rodas */
    .wheel {
      position: absolute;
      width: 10px;
      height: 25px;
      background: #111;
      border-radius: 4px;
    }

    .wheel.left {
      left: -7px;
      top: 18px;
    }

    .wheel.right {
      right: -7px;
      top: 18px;
    }

    .wheel.left2 {
      left: -7px;
      bottom: 15px;
    }

    .wheel.right2 {
      right: -7px;
      bottom: 15px;
    }

    /* Carros inimigos */
    .enemy {
      position: absolute;
      width: 55px;
      height: 90px;
      border-radius: 12px 12px 8px 8px;
      z-index: 5;
      box-shadow: 0 0 8px rgba(0,0,0,.5);
    }

    .enemy::before {
      content: "";
      position: absolute;
      width: 35px;
      height: 35px;
      top: 12px;
      left: 10px;
      background: #222;
      border-radius: 7px;
    }

    /* Painel */
    #score {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      z-index: 50;
      text-shadow: 2px 2px #000;
    }

    #speed {
      position: absolute;
      top: 45px;
      left: 15px;
      color: #fff;
      font-size: 14px;
      z-index: 50;
      text-shadow: 2px 2px #000;
    }

    /* Tela inicial / game over */
    #menu {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.8);
      z-index: 100;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #menu h1 {
      font-size: 42px;
      color: #ff2222;
      margin-bottom: 15px;
      text-shadow: 3px 3px #000;
    }

    #menu p {
      margin: 6px 0;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 8px;
      background: #e60000;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff3333;
      transform: scale(1.05);
    }

    /* Controles mobile */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      z-index: 200;
    }

    .control {
      width: 70px;
      height: 60px;
      border-radius: 15px;
      border: 2px solid white;
      background: rgba(0,0,0,.5);
      color: white;
      font-size: 30px;
    }

    @media (min-width: 600px) {
      #controls {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <div class="road"></div>

    <div id="score">Pontos: 0</div>
    <div id="speed">Velocidade: 1x</div>

    <div id="player">
      <div class="wheel left"></div>
      <div class="wheel right"></div>
      <div class="wheel left2"></div>
      <div class="wheel right2"></div>
    </div>

    <div id="menu">
      <h1>🏎️ MINI CARRO</h1>
      <p>Desvie dos carros!</p>
      <p>Use <b>← →</b> ou <b>A/D</b> para dirigir.</p>
      <p>Quanto mais tempo sobreviver, mais pontos ganha.</p>

      <button id="start">JOGAR</button>
    </div>

  </div>

  <div id="controls">
    <button class="control" id="left">←</button>
    <button class="control" id="right">→</button>
  </div>

<script>
  const game = document.getElementById("game");
  const player = document.getElementById("player");
  const menu = document.getElementById("menu");
  const startButton = document.getElementById("start");
  const scoreText = document.getElementById("score");
  const speedText = document.getElementById("speed");

  let playerX = 172;
  let enemies = [];
  let lines = [];

  let score = 0;
  let speed = 5;
  let gameRunning = false;
  let keys = {};

  // Criar faixas
  for (let i = 0; i < 8; i++) {
    const line = document.createElement("div");
    line.className = "line";
    line.style.top = (i * 100 - 100) + "px";
    game.appendChild(line);
    lines.push(line);
  }

  // Teclado
  document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
  });

  document.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // Botões mobile
  document.getElementById("left").addEventListener("touchstart", () => {
    keys["arrowleft"] = true;
  });

  document.getElementById("left").addEventListener("touchend", () => {
    keys["arrowleft"] = false;
  });

  document.getElementById("right").addEventListener("touchstart", () => {
    keys["arrowright"] = true;
  });

  document.getElementById("right").addEventListener("touchend", () => {
    keys["arrowright"] = false;
  });

  document.getElementById("left").addEventListener("mousedown", () => {
    keys["arrowleft"] = true;
  });

  document.getElementById("left").addEventListener("mouseup", () => {
    keys["arrowleft"] = false;
  });

  document.getElementById("right").addEventListener("mousedown", () => {
    keys["arrowright"] = true;
  });

  document.getElementById("right").addEventListener("mouseup", () => {
    keys["arrowright"] = false;
  });

  function startGame() {
    score = 0;
    speed = 5;
    playerX = 172;
    enemies.forEach(enemy => enemy.remove());
    enemies = [];

    player.style.left = playerX + "px";

    menu.style.display = "none";
    gameRunning = true;

    gameLoop();
    createEnemy();
  }

  function createEnemy() {
    if (!gameRunning) return;

    const enemy = document.createElement("div");
    enemy.className = "enemy";

    const colors = [
      "#0066ff",
      "#00cc66",
      "#ff9900",
      "#9900ff",
      "#ffff00"
    ];

    enemy.style.background =
      colors[Math.floor(Math.random() * colors.length)];

    // 3 pistas
    const lanes = [65, 172, 280];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];

    enemy.style.left = lane + "px";
    enemy.style.top = "-100px";

    game.appendChild(enemy);
    enemies.push(enemy);

    setTimeout(createEnemy, Math.max(500, 1200 - score * 3));
  }

  function collision(a, b) {
    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
      r1.bottom < r2.top ||
      r1.top > r2.bottom ||
      r1.right < r2.left ||
      r1.left > r2.right
    );
  }

  function gameOver() {
    gameRunning = false;

    menu.style.display = "flex";

    menu.innerHTML = `
      <h1>💥 BATEU!</h1>
      <p>Você fez <b>${score}</b> pontos!</p>
      <p>Tente chegar ainda mais longe.</p>
      <button id="restart">JOGAR NOVAMENTE</button>
    `;

    document.getElementById("restart").onclick = startGame;
  }

  function gameLoop() {
    if (!gameRunning) return;

    // Movimento do jogador
    if (keys["arrowleft"] || keys["a"]) {
      playerX -= 7;
    }

    if (keys["arrowright"] || keys["d"]) {
      playerX += 7;
    }

    // Limites da pista
    if (playerX < 30) playerX = 30;
    if (playerX > 315) playerX = 315;

    player.style.left = playerX + "px";

    // Movimento das faixas
    lines.forEach(line => {
      let top = parseInt(line.style.top);
      top += speed;

      if (top > game.clientHeight) {
        top = -80;
      }

      line.style.top = top + "px";
    });

    // Movimento dos inimigos
    enemies.forEach((enemy, index) => {
      let top = parseInt(enemy.style.top);
      top += speed;

      enemy.style.top = top + "px";

      // Colisão
      if (collision(player, enemy)) {
        gameOver();
      }

      // Saiu da tela
      if (top > game.clientHeight + 100) {
        enemy.remove();
        enemies.splice(index, 1);

        score++;

        // Aumenta a dificuldade
        if (score % 10 === 0) {
          speed += 0.7;
        }
      }
    });

    scoreText.textContent = "Pontos: " + score;
    speedText.textContent =
      "Velocidade: " + speed.toFixed(1) + "x";

    requestAnimationFrame(gameLoop);
  }

  startButton.onclick = startGame;
</script>

</body>
</html>
